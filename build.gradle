plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'gg.jte.gradle' version '3.1.12'
}

group = 'com.livingcostcheck'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/jte' 
        }
        resources {
            setSrcDirs(['src/main/resources', 'src/main/jte'])
        }
    }
}

jte {
    sourceDirectory = file('src/main/jte').toPath()
    contentType = gg.jte.ContentType.Html
    binaryStaticContent = true
    generate()
}


repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'gg.jte:jte-spring-boot-starter-3:3.1.12'
	implementation 'gg.jte:jte:3.1.12'
	implementation 'org.apache.pdfbox:pdfbox:3.0.4'
	implementation 'net.sourceforge.tess4j:tess4j:5.18.0'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.microsoft.playwright:playwright:1.49.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'playwright'
	}
	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}
}

tasks.register('playwrightInstall', JavaExec) {
	group = 'verification'
	description = 'Install Playwright browser binaries used by e2e tests'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.microsoft.playwright.CLI'
	args 'install', 'chromium'
}

tasks.register('playwrightTest', Test) {
	group = 'verification'
	description = 'Runs browser-based persona e2e tests'
	useJUnitPlatform {
		includeTags 'playwright'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter tasks.named('test')
}

tasks.withType(JavaCompile) {
	options.compilerArgs << "-parameters"
}

tasks.named('processResources') {
	doNotTrackState('Static resource generation leaves unstable destination metadata on this workspace.')
}
