version: '3.8'
services:
  app:
    # 💡 변수 대신 실제 도커허브 아이디를 직접 입력합니다.
    image: shinhyeok22/home-repair-verdict:latest
    container_name: home-repair-app
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/homerepair
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=mypassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - db
    networks:
      - homerepair-net

  db:
    image: postgres:15-alpine
    container_name: home-repair-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=homerepair
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - homerepair-net

networks:
  homerepair-net:
    driver: bridge

volumes:
  postgres_data:
